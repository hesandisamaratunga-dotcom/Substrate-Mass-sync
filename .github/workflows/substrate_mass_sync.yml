name: Substrate Mass Sync (v2)

on:
  workflow_dispatch:      # lets you trigger it manually to test
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC = 12:00 CEST (German summer time)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python fetch_substrate_mass.py
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FILE_PATH: ${{ secrets.SHAREPOINT_FILE_PATH }}
          DATACAKE_API_TOKEN: ${{ secrets.DATACAKE_API_TOKEN }}
          DATACAKE_DEVICE_SERIAL: ${{ secrets.DATACAKE_DEVICE_SERIAL }}
          DATACAKE_FIELD_KEY: ${{ secrets.DATACAKE_FIELD_KEY }}

name: Substrate Mass Backfill (manual)

on:
  workflow_dispatch:   # manual trigger only - intentionally no schedule

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python backfill_substrate_mass.py
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FILE_PATH: ${{ secrets.SHAREPOINT_FILE_PATH }}
          DATACAKE_API_TOKEN: ${{ secrets.DATACAKE_API_TOKEN }}
          DATACAKE_DEVICE_SERIAL: ${{ secrets.DATACAKE_DEVICE_SERIAL }}
          DATACAKE_FIELD_KEY: ${{ secrets.DATACAKE_FIELD_KEY }}
